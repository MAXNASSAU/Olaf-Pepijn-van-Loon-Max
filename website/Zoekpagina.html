<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Zoeken - MTB Oosterhout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .search-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #e0e0e0;
            outline: none;
            transition: 0.3s ease;
        }

        .search-input:focus {
            background-color: #d6d6d6;
        }

        .search-input::placeholder {
            color: #666;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <input 
            type="text" 
            class="search-input" 
            placeholder="Begin nu met zoeken..."
        >
    </div>

</body>
</html>
